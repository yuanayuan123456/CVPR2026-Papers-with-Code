# Comparison experiment configs — run one model at a time:
#   python train.py --config configs/comparison.yaml --model unet
#   python train.py --config configs/comparison.yaml --model deeplabv3plus
#   python train.py --config configs/comparison.yaml --model segformer
#   python train.py --config configs/comparison.yaml --model hrnet
#   python train.py --config configs/comparison.yaml --model lsformer

dataset:
  image_dir:    ./data/images
  mask_dir:     ./data/masks
  img_suffix:   .jpg
  mask_suffix:  .png
  num_classes:  2
  ignore_index: 255
  crop_size:    512
  val_size:     512
  train_ratio:  0.70
  val_ratio:    0.15
  split_file:   null
  use_elastic:  true
  use_cutmix:   false
  seed:         42
  class_names:
    - background
    - landslide

model:
  name:         lsformer            # OVERRIDE via --model flag
  num_classes:  2
  pretrained:   true
  in_channels:  3

loss:
  w_ce:          1.0
  w_dice:        0.5
  w_focal:       0.5
  w_aux:         0.4
  w_bnd:         0.3
  label_smoothing: 0.05
  use_focal:     true
  use_class_weights: true

optimizer:
  type:          adamw
  lr:            6.0e-5
  weight_decay:  0.01
  betas:         [0.9, 0.999]
  backbone_lr_multiplier: 0.1

scheduler:
  type:          poly
  power:         1.0
  min_lr:        1.0e-6
  warmup_epochs: 5

train:
  epochs:        100
  batch_size:    8
  val_batch:     4
  num_workers:   4
  pin_memory:    true
  grad_clip:     1.0
  eval_interval: 1
  save_interval: 10
  amp:           true

output:
  save_dir:      ./work_dirs/comparison
  log_interval:  20
  save_pred_grid: true
