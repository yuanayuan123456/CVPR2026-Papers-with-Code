# MLFormer configuration — optimised for the novel model
# Usage: python train.py --model mlformer --config configs/mlformer.yaml

dataset:
  image_dir:    ./data/images
  mask_dir:     ./data/masks
  img_suffix:   .jpg
  mask_suffix:  .png
  num_classes:  2
  ignore_index: 255
  crop_size:    512
  val_size:     512
  train_ratio:  0.70
  val_ratio:    0.15
  split_file:   null
  use_elastic:  true    # elastic deformation helps with landslide shape variety
  use_cutmix:   true    # CutMix reduces overfitting on small datasets
  seed:         42
  class_names:
    - background
    - landslide

model:
  name:         mlformer
  num_classes:  2
  pretrained:   true    # ImageNet ResNet-50 for CNN branch
  in_channels:  3

loss:
  w_ce:          1.0
  w_dice:        0.6    # higher Dice weight since class imbalance is severe
  w_focal:       0.5
  w_aux:         0.4    # deep supervision
  w_bnd:         0.4    # higher boundary weight since DBAM uses it
  label_smoothing: 0.05
  use_focal:     true
  use_class_weights: true

optimizer:
  type:          adamw
  lr:            4.0e-5  # slightly lower for VSS branch stability
  weight_decay:  0.01
  betas:         [0.9, 0.999]
  backbone_lr_multiplier: 0.1

scheduler:
  type:          poly
  power:         0.9
  min_lr:        1.0e-6
  warmup_epochs: 5

train:
  epochs:        120     # longer training for the more complex model
  batch_size:    8
  val_batch:     4
  num_workers:   4
  pin_memory:    true
  grad_clip:     1.0
  eval_interval: 1
  save_interval: 10
  amp:           true

output:
  save_dir:      ./work_dirs/mlformer
  log_interval:  20
  save_pred_grid: true
